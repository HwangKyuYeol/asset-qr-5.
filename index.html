<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b37">
<title>건설근로자공제회 자산 QR 스캔</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#17202d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 14px 40px}
.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:25px}.sub{color:#6b7280;line-height:1.55;font-size:14px}
#reader{width:100%;overflow:hidden;border-radius:16px;background:#111;margin-top:16px}
#reader video{border-radius:16px!important;object-fit:cover!important}
button{width:100%;height:56px;border:0;border-radius:14px;font-size:18px;font-weight:800}
.start{background:#176b37;color:#fff}.stop{background:#9b2c2c;color:#fff;margin-top:10px;display:none}
.status{margin-top:14px;padding:13px 14px;border-radius:12px;background:#eef6f0;color:#176b37;font-size:14px;line-height:1.5}
.manual{display:flex;gap:8px;margin-top:12px}
input{min-width:0;flex:1;height:50px;border:1px solid #d7dce2;border-radius:12px;padding:0 13px;font-size:16px;text-transform:uppercase}
.go{width:110px;height:50px;background:#17202d;color:#fff;font-size:15px}
.hint{font-size:12px;color:#7b8492;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>자산 QR 스캔</h1>
<div class="sub">QR을 인식하면 자산번호를 추출하여 자산점검 화면으로 자동 이동합니다.</div>
</div>
<div class="card">
<button id="startBtn" class="start" onclick="startScanner()">카메라로 QR 스캔</button>
<button id="stopBtn" class="stop" onclick="stopScanner()">스캔 종료</button>
<div id="reader"></div>
<div id="status" class="status">버튼을 누르면 후면 카메라가 실행됩니다.</div>
<div class="hint">QR이 사각형 안에 들어오도록 맞춰주세요. 처음 실행할 때 Safari에서 카메라 접근을 묻는 창이 나오면 ‘허용’을 눌러주세요.</div>
<div class="manual">
<input id="assetNo" placeholder="A20190362" autocomplete="off">
<button class="go" onclick="manualGo()">직접 조회</button>
</div>
</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwa0sT0E5Y3Acp70kz__BXMgE_nffHA-CBw6hSQIEkfK7KY1ndJxsg1dkEY47hn9HnnFw/exec";
let scanner=null, running=false, locked=false;

function extractAssetNo(raw){
  const text=String(raw||'').toUpperCase();
  const m=text.match(/A\s*[-_]?\s*(\d{8})/i);
  return m ? 'A'+m[1] : '';
}
function setStatus(msg,error=false){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.style.background=error?'#fef2f2':'#eef6f0';
  el.style.color=error?'#991b1b':'#176b37';
}
async function startScanner(){
  if(running)return;
  locked=false; setStatus('카메라를 준비하고 있습니다...');
  try{
    scanner=scanner||new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
    const config={
      fps:15,
      qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.72);return {width:s,height:s};},
      aspectRatio:1,
      disableFlip:false,
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}
    };
    try{
      await scanner.start({facingMode:{exact:'environment'}},config,onSuccess,()=>{});
    }catch(firstErr){
      await scanner.start({facingMode:'environment'},config,onSuccess,()=>{});
    }
    running=true;
    document.getElementById('startBtn').style.display='none';
    document.getElementById('stopBtn').style.display='block';
    setStatus('스캔 중입니다. QR을 사각형 안에 맞춰주세요.');
  }catch(e){
    setStatus('카메라를 열 수 없습니다. Safari에서 이 사이트의 카메라 권한을 허용한 뒤 새로고침해주세요.',true);
  }
}
async function stopScanner(){
  if(scanner&&running){try{await scanner.stop();}catch(e){}}
  running=false;
  document.getElementById('startBtn').style.display='block';
  document.getElementById('stopBtn').style.display='none';
  setStatus('스캔을 종료했습니다.');
}
async function onSuccess(decodedText){
  if(locked)return;
  const assetNo=extractAssetNo(decodedText);
  if(!assetNo){
    setStatus('QR은 읽었지만 자산번호(A + 숫자 8자리)를 찾지 못했습니다.',true);
    return;
  }
  locked=true;
  document.getElementById('assetNo').value=assetNo;
  setStatus('인식 완료: '+assetNo+' · 자산정보를 여는 중...');
  try{if(scanner&&running)await scanner.stop();}catch(e){}
  location.href=GAS_URL+'?asset='+encodeURIComponent(assetNo);
}
function manualGo(){
  const assetNo=extractAssetNo(document.getElementById('assetNo').value);
  if(!assetNo){setStatus('A20190362 형식으로 자산번호를 입력해주세요.',true);return;}
  location.href=GAS_URL+'?asset='+encodeURIComponent(assetNo);
}
</script>
</body>
</html>
